<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoTech - Criar Conta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { light: '#E8F5E9', DEFAULT: '#2E7D32', dark: '#1B5E20', accent: '#81C784' } }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 flex justify-center items-center min-h-screen font-sans">

  <div class="app-frame w-full bg-slate-50 relative flex flex-col justify-between overflow-hidden md:rounded-[40px] md:border-[8px] my-0 md:my-4 shadow-2xl">
    
    <div class="bg-gradient-to-b from-brand-dark via-brand to-emerald-600 text-white pt-10 pb-14 px-6 text-center relative rounded-b-[35px] shadow-lg">
      <a href="login.html" class="absolute left-5 top-8 w-8 h-8 bg-white/10 hover:bg-white/20 rounded-xl flex items-center justify-center text-white backdrop-blur-md border border-white/20 transition">
        <i class="fa-solid fa-arrow-left text-xs"></i>
      </a>
      
      <div class="w-16 h-16 bg-white/10 backdrop-blur-md rounded-2xl mx-auto flex items-center justify-center border border-white/20 mb-3 shadow-inner">
        <i class="fa-solid fa-user-plus text-3xl text-green-300"></i>
      </div>
      <h1 class="font-extrabold text-xl tracking-wide">Crie sua Conta</h1>
      <p class="text-xs text-green-100/90 mt-1">Junte-se à comunidade EcoTech!</p>
    </div>

    <main class="flex-1 px-6 -mt-8 z-10 space-y-4">
      <div class="bg-white p-6 rounded-3xl shadow-xl border border-slate-100">
        <form onsubmit="realizarCadastro(event)" class="space-y-3.5">
          
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nome Completo</label>
            <div class="relative">
              <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
              <input type="text" id="cadNome" required placeholder="Ex: Pedro Henrique" class="w-full text-xs pl-10 pr-3 py-3 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:outline-none focus:border-brand transition">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">E-mail</label>
            <div class="relative">
              <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
              <input type="email" required placeholder="seuemail@escola.com" class="w-full text-xs pl-10 pr-3 py-3 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:outline-none focus:border-brand transition">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Turma / Categoria</label>
            <div class="relative">
              <i class="fa-solid fa-graduation-cap absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
              <select class="w-full text-xs pl-10 pr-3 py-3 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:outline-none focus:border-brand transition text-slate-700">
                <option value="3º E">Turma 3º E</option>
                <option value="Estudante">Estudante (Outra Turma)</option>
                <option value="Comunidade">Morador da Comunidade</option>
                <option value="Professor">Professor / Orientador</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Senha</label>
            <div class="relative">
              <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
              <input type="password" required placeholder="Crie uma senha" class="w-full text-xs pl-10 pr-3 py-3 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:outline-none focus:border-brand transition">
            </div>
          </div>

          <button type="submit" class="w-full bg-brand text-white py-3.5 rounded-xl font-bold text-xs shadow-md shadow-brand/20 hover:bg-brand-dark transition transform active:scale-95 mt-2">
            Cadastrar e Ganhar +350 pts 🌱
          </button>
        </form>

        <div class="mt-4 text-center border-t border-slate-100 pt-3">
          <p class="text-xs text-slate-500">Já tem uma conta? <a href="login.html" class="text-brand font-bold hover:underline">Fazer Login</a></p>
        </div>
      </div>
    </main>

    <div class="p-4 text-center border-t border-slate-100 bg-white">
      <p class="text-[10px] text-slate-400">EcoTech • ODS 11, 12 e 13</p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
