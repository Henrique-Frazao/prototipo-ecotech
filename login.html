<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoTech - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { light: '#E8F5E9', DEFAULT: '#2E7D32', dark: '#1B5E20', accent: '#81C784' } }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 flex justify-center items-center min-h-screen font-sans">

  <div class="app-frame w-full bg-slate-50 relative flex flex-col justify-between overflow-hidden md:rounded-[40px] md:border-[8px] my-0 md:my-4 shadow-2xl">
    
    <div class="bg-gradient-to-b from-brand-dark via-brand to-emerald-600 text-white pt-12 pb-16 px-6 text-center relative rounded-b-[35px] shadow-lg">
      <div class="w-20 h-20 bg-white/10 backdrop-blur-md rounded-3xl mx-auto flex items-center justify-center border border-white/20 mb-4 shadow-inner">
        <i class="fa-solid fa-leaf text-4xl text-green-300"></i>
      </div>
      <h1 class="font-extrabold text-2xl tracking-wide">EcoTech</h1>
      <p class="text-xs text-green-100/90 mt-1">Coleta Seletiva & Sustentabilidade</p>
      <span class="inline-block mt-3 text-[10px] bg-white/15 px-3 py-1 rounded-full text-green-100 font-semibold backdrop-blur-sm border border-white/10">Turma 3º E</span>
    </div>

    <main class="flex-1 px-6 -mt-8 z-10 space-y-4">
      <div class="bg-white p-6 rounded-3xl shadow-xl border border-slate-100">
        <h2 class="text-lg font-bold text-slate-800 mb-1">Bem-vindo(a)</h2>
        <p class="text-xs text-slate-400 mb-6">Acesse para registrar seus descartes e somar pontos.</p>

        <form onsubmit="realizarLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Seu Nome</label>
            <div class="relative">
              <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
              <input type="text" id="usuarioInput" required placeholder="Ex: Pedro Henrique" class="w-full text-xs pl-10 pr-3 py-3 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:outline-none focus:border-brand transition">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Senha</label>
            <div class="relative">
              <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
              <input type="password" required placeholder="••••••••" class="w-full text-xs pl-10 pr-3 py-3 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:outline-none focus:border-brand transition">
            </div>
          </div>

          <button type="submit" class="w-full bg-brand text-white py-3.5 rounded-xl font-bold text-xs shadow-md shadow-brand/20 hover:bg-brand-dark transition transform active:scale-95">
            Entrar no App
          </button>
        </form>

        <div class="mt-4 text-center border-t border-slate-100 pt-3">
          <p class="text-xs text-slate-500">Ainda não tem conta? <a href="cadastro.html" class="text-brand font-bold hover:underline">Cadastre-se aqui</a></p>
        </div>
      </div>
    </main>

    <div class="p-4 text-center border-t border-slate-100 bg-white">
      <p class="text-[10px] text-slate-400">Desenvolvido por Henrique, Pedro, Guilherme, Daniel e Ian.</p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
